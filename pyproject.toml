[project]
name = "ai-cookbook-anthropic"
version = "0.1.0"
description = "Anthropic SDK versions of the examples from Dave Ebbelaar's ai-cookbook (https://github.com/daveebbelaar/ai-cookbook)"
readme = "README.md"
authors = [
    { name = "Steph" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "docling>=2.138.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "lancedb>=0.40.0",
    "nest-asyncio2>=1.7.3",
    "openai>=3.29.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "tiktoken>=0.14.0",
]
